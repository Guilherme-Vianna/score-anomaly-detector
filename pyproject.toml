[project]
name = "ml-school-anomaly-detection"
version = "0.1.0"
description = "Detecção de quedas bruscas de desempenho por sala com IsolationForest e Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "plotly>=5.24",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
